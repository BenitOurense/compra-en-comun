name: Comprobaciones de Market Sinc
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Buscar patrones de credenciales privadas
        run: node pruebas/tools/security-check.cjs
      - name: Probar aislamiento, permisos y límites de solicitudes
        run: node --test pruebas/tests/*.test.cjs
      - name: Probar el generador de catálogo
        run: python3 -m unittest discover -s pruebas/tools -p 'test_*.py'

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/pruebas/tests/firestore/node_modules
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar herramientas de prueba con versiones fijadas
        run: npm install --prefix pruebas/tests/firestore --no-audit --no-fund --ignore-scripts
      - name: Probar autorización con cuentas ficticias en emulador
        run: >-
          pruebas/tests/firestore/node_modules/.bin/firebase emulators:exec
          --only firestore --project demo-marketsinc-rules --config firebase.rules-test.json
          'node --test pruebas/tests/firestore/rules.test.cjs'
