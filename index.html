<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compra en común</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17342a;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}header{background:#146c4b;color:white;padding:24px 18px}header div,main{max-width:760px;margin:auto}h1{margin:0;font-size:1.8rem}header p{margin:8px 0 0;color:#d5f3e3}main{padding:24px 16px}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px #153c2712;margin-bottom:20px}h2{margin:0 0 16px;font-size:1.2rem}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:180px;padding:12px;border:1px solid #afc4b8;border-radius:9px;font:inherit}button{font:inherit;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;background:#146c4b;color:white}button:focus-visible,input:focus-visible{outline:3px solid #ffa947;outline-offset:2px}.secondary{background:#e8f2ec;color:#145c40}.danger{background:#fff0ee;color:#a72b20}.list{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #e6eee8}.list:last-child{border-bottom:0}.list strong{display:block;overflow-wrap:anywhere}.list small{color:#65776d}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{color:#66786e;padding:18px 0}ul{padding:0;list-style:none}li.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e6eee8}li.item span{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#89968e}.back{margin-bottom:16px}footer{font-size:.85rem;color:#65776d;text-align:center;padding:12px 16px 30px}@media(max-width:480px){.list{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style></head><body><header><div><h1>🛒 Compra en común</h1><p>Tus listas de la compra, sin complicaciones</p></div></header><main>
<section id="home"><div class="panel"><h2>Crear una lista</h2><form id="new-list"><input id="list-name" maxlength="70" placeholder="Ej.: Compra semanal" aria-label="Nombre de la lista" required><button>Crear lista</button></form></div><div class="panel"><h2>Mis listas</h2><div id="lists"></div></div></section>
<section id="detail" hidden><button class="secondary back" id="back">← Mis listas</button><div class="panel"><h2 id="detail-title"></h2><form id="new-item"><input id="item-name" maxlength="100" placeholder="Ej.: Leche" aria-label="Producto" required><button>Añadir</button></form><ul id="items"></ul></div></section>
</main><footer>Primera versión: datos guardados únicamente en este dispositivo. Aún no hay sincronización ni cuentas.</footer>
<script>
'use strict';
const KEY='compra-en-comun-v1';
let lists=[];
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))lists=saved.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.items));}catch{}
let active=null;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(lists));}catch{alert('No se pudieron guardar los cambios en este navegador.');}};
const makeButton=(label,cls,fn)=>{const b=document.createElement('button');b.textContent=label;b.className=cls;b.type='button';b.addEventListener('click',fn);return b;};
function renderLists(){const root=$('lists');root.replaceChildren();if(!lists.length){const p=document.createElement('p');p.className='empty';p.textContent='Todavía no tienes listas. ¡Crea la primera!';root.append(p);return;}
for(const list of lists){const row=document.createElement('div');row.className='list';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=list.name;const count=document.createElement('small');count.textContent=list.items.length+' productos';info.append(name,count);const actions=document.createElement('div');actions.className='actions';actions.append(makeButton('Abrir','secondary',()=>openList(list.id)),makeButton('Eliminar','danger',()=>{if(confirm('¿Eliminar la lista «'+list.name+'» y todos sus productos?')){lists=lists.filter(x=>x.id!==list.id);save();renderLists();}}));row.append(info,actions);root.append(row);}}
function openList(id){active=id;$('home').hidden=true;$('detail').hidden=false;renderItems();}
function renderItems(){const list=lists.find(x=>x.id===active);if(!list){goBack();return;}$('detail-title').textContent=list.name;const root=$('items');root.replaceChildren();if(!list.items.length){const p=document.createElement('p');p.className='empty';p.textContent='Añade el primer producto.';root.append(p);}
for(const item of list.items){const li=document.createElement('li');li.className='item';const check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label','Marcar '+item.name);check.addEventListener('change',()=>{item.done=check.checked;save();renderItems();});const name=document.createElement('span');name.textContent=item.name;if(item.done)name.className='done';li.append(check,name,makeButton('Quitar','danger',()=>{list.items=list.items.filter(x=>x.id!==item.id);save();renderItems();}));root.append(li);}}
function goBack(){active=null;$('detail').hidden=true;$('home').hidden=false;renderLists();}
$('back').addEventListener('click',goBack);
$('new-list').addEventListener('submit',e=>{e.preventDefault();const name=$('list-name').value.trim();if(!name)return;lists.push({id:crypto.randomUUID(),name,items:[]});save();$('list-name').value='';renderLists();});
$('new-item').addEventListener('submit',e=>{e.preventDefault();const name=$('item-name').value.trim();const list=lists.find(x=>x.id===active);if(!name||!list)return;list.items.push({id:crypto.randomUUID(),name,done:false});save();$('item-name').value='';renderItems();$('item-name').focus();});
renderLists();
</script></body></html>
